services:
  - type: web
    name: events-booking
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:asgi_app --host 0.0.0.0 --port $PORT --workers 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
