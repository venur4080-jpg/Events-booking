<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Venue Map &amp; Seat Navigation — {{ event.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=8.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <style>
        :root {
            --fp-bg: #070709;
            --fp-card: rgba(15, 23, 42, 0.94);
            --fp-border: rgba(255, 255, 255, 0.08);
            --cyan-glow: #00d2ff;
        }

        body {
            background-color: var(--fp-bg);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-bottom: 5rem;
        }

        .fp-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .map-card {
            background: var(--fp-card);
            border: 1px solid var(--fp-border);
            border-radius: 20px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--fp-border);
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip.active, .filter-chip:hover {
            background: rgba(0, 210, 255, 0.2);
            color: var(--cyan-glow);
            border-color: var(--cyan-glow);
        }

        #svgMap {
            width: 100%;
            height: auto;
            max-height: 600px;
            background: #090d16;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: block;
        }

        .zone-rect {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .zone-rect:hover {
            filter: brightness(1.25);
            stroke-width: 3;
            stroke: #00d2ff;
        }

        .tracer-path {
            stroke-dasharray: 8;
            animation: dashPulse 1.4s linear infinite;
        }

        @keyframes dashPulse {
            to {
                stroke-dashoffset: -32;
            }
        }
    </style>
</head>
<body>

    <div class="fp-container">
        <!-- Back Button -->
        <a href="{{ url_for('event_detail', event_id=event.id) }}" class="back-btn-unified" style="margin-bottom: 1.5rem; display: inline-flex;">
            <span class="arrow">←</span> Back to Event Details
        </a>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div>
                <h1 style="font-family: 'Outfit', sans-serif; font-size: 2rem; margin: 0 0 4px; color: #fff;">Interactive Venue Floorplan</h1>
                <p style="color: #94a3b8; margin: 0; font-size: 0.9rem;">📍 {{ layout.venue_name or event.venue }} • Live Wayfinding &amp; Seat Navigation</p>
            </div>

            <!-- Seat Finder Box -->
            <div style="display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 12px; border: 1px solid var(--fp-border);">
                <label style="font-size: 0.8rem; color: #94a3b8; font-weight: 700;">Find My Seat:</label>
                <input type="text" id="seatInput" value="{{ target_seat }}" placeholder="e.g. A-14, B-08" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 6px 10px; border-radius: 6px; width: 100px; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; font-weight: 700;">
                <button type="button" onclick="traceSeatRoute()" style="background: linear-gradient(135deg, #0284c7, #00d2ff); border: none; color: #0b0f19; font-weight: 800; padding: 7px 14px; border-radius: 6px; cursor: pointer;">Trace ➔</button>
            </div>
        </div>

        <!-- Filter Chips -->
        <div style="display: flex; gap: 8px; margin-bottom: 1.2rem; flex-wrap: wrap;">
            <button class="filter-chip active" onclick="filterZones('all', this)">All Amenities</button>
            <button class="filter-chip" onclick="filterZones('stage', this)">🎤 Main Stage</button>
            <button class="filter-chip" onclick="filterZones('seats', this)">💺 Seating Zones</button>
            <button class="filter-chip" onclick="filterZones('booths', this)">🏢 Sponsor Expo</button>
            <button class="filter-chip" onclick="filterZones('amenity', this)">☕ Food &amp; Restrooms</button>
        </div>

        <!-- SVG Map Container -->
        <div class="map-card">
            <svg id="svgMap" viewBox="0 0 1000 700">
                <!-- Grid Backdrop -->
                <defs>
                    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
                    </pattern>
                </defs>
                <rect width="1000" height="700" fill="url(#smallGrid)"/>

                <!-- Render Zones -->
                {% for z in layout.zones %}
                <g class="zone-group" data-type="{{ z.type }}" onclick="selectZone('{{ z.name }}', '{{ z.type }}')">
                    <rect class="zone-rect" x="{{ z.x }}" y="{{ z.y }}" width="{{ z.w }}" height="{{ z.h }}" rx="10" fill="{{ z.color }}" fill-opacity="0.25" stroke="{{ z.color }}" stroke-width="2"/>
                    <text x="{{ z.x + z.w / 2 }}" y="{{ z.y + z.h / 2 }}" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="14" text-anchor="middle" dominant-baseline="middle">
                        {{ z.name }}
                    </text>
                </g>
                {% endfor %}

                <!-- Dynamic Route Tracer Path -->
                <path id="routeLine" d="" fill="none" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" class="tracer-path" style="display: none;"/>
                <circle id="seatMarker" cx="0" cy="0" r="10" fill="#ec4899" stroke="#ffffff" stroke-width="3" style="display: none;"/>
            </svg>

            <!-- Status Box -->
            <div id="infoBanner" style="margin-top: 1rem; background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--fp-border); display: flex; justify-content: space-between; align-items: center;">
                <span id="zoneDetailText" style="color: #cbd5e1; font-size: 0.9rem;">Click any hall zone to inspect admission rules or enter a seat number above.</span>
                <span style="font-size: 0.8rem; color: #00d2ff; font-weight: 700;">🟢 Turnstiles Online (Fast-Track Active)</span>
            </div>
        </div>
    </div>

    <script>
        function filterZones(type, btn) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');

            document.querySelectorAll('.zone-group').forEach(el => {
                if (type === 'all' || el.getAttribute('data-type') === type) {
                    el.style.opacity = '1';
                } else {
                    el.style.opacity = '0.15';
                }
            });
        }

        function selectZone(name, type) {
            document.getElementById('zoneDetailText').innerHTML = `📍 Selected: <strong style="color: #fff;">${name}</strong> (${type.toUpperCase()}) — Direct access open to badge holders.`;
        }

        function traceSeatRoute() {
            const code = document.getElementById('seatInput').value.trim().toUpperCase();
            if (!code) {
                if (window.showToast) window.showToast('Please enter a seat number (e.g. A-14)', 'info', 3000);
                return;
            }

            const path = document.getElementById('routeLine');
            const marker = document.getElementById('seatMarker');
            
            // Turnstile entry coordinates (x: 500, y: 660)
            const entryX = 500;
            const entryY = 660;

            let targetX = 340;
            let targetY = 310;
            let zoneName = "VIP Seating (Zone A)";

            if (code.startsWith('B') || code.includes('B')) {
                targetX = 660;
                targetY = 310;
                zoneName = "Executive Seating (Zone B)";
            }

            // Draw curved path
            path.setAttribute('d', `M ${entryX} ${entryY} C ${entryX} 500, ${targetX} 500, ${targetX} ${targetY}`);
            path.style.display = 'block';

            marker.setAttribute('cx', targetX);
            marker.setAttribute('cy', targetY);
            marker.style.display = 'block';

            document.getElementById('zoneDetailText').innerHTML = `✨ <strong>Route Traced for Seat ${code}</strong>: Enter North Turnstiles ➔ Follow blue route to <span style="color: #38bdf8; font-weight: 700;">${zoneName}</span>.`;
            if (window.showToast) window.showToast(`Wayfinding path active for Seat ${code}`, 'success', 3500);
        }

        window.addEventListener('load', () => {
            const initialSeat = "{{ target_seat }}";
            if (initialSeat) {
                traceSeatRoute();
            }
        });
    </script>
</body>
</html>
