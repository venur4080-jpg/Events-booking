<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendee Badge — {{ badge.name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f1f5f9;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 3" x 4" Standard Conference Lanyard Badge Dimensions */
        .badge-card {
            width: 320px;
            height: 440px;
            background: #0b0f19;
            color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border: 2px solid #008be3;
            position: relative;
            box-sizing: border-box;
        }

        .badge-slot-hole {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.4);
        }

        .badge-header {
            background: linear-gradient(135deg, #008be3 0%, #005691 100%);
            padding: 24px 16px 14px;
            text-align: center;
        }

        .badge-photo-wrap {
            margin: -25px auto 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3.5px solid #0b0f19;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            background: #1e293b;
        }

        .badge-photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-body {
            text-align: center;
            padding: 8px 16px;
        }

        .badge-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            margin: 6px 0 2px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .badge-handle {
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .badge-seat-pill {
            display: inline-block;
            background: rgba(0, 139, 227, 0.15);
            border: 1.5px solid #008be3;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 6px;
            font-size: 0.88rem;
        }

        .badge-footer {
            background: #06080e;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .no-print {
            margin-top: 20px;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .no-print {
                display: none;
            }
            .badge-card {
                box-shadow: none;
                border: 1.5px solid #000;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="badge-card">
        <div class="badge-slot-hole"></div>

        <div class="badge-header">
            <div style="font-size: 0.68rem; font-weight: 800; color: #bae6fd; text-transform: uppercase; letter-spacing: 1px;">
                OFFICIAL ATTENDEE PASS
            </div>
            <div style="font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 900; color: #ffffff; margin-top: 2px;">
                {{ badge.event_title }}
            </div>
        </div>

        <div class="badge-photo-wrap">
            <img src="{{ badge.photo }}" alt="{{ badge.name }}">
        </div>

        <div class="badge-body">
            <div class="badge-name">{{ badge.name }}</div>
            <div class="badge-handle">@{{ badge.username }}</div>
            <div class="badge-seat-pill">SEAT: {{ badge.seat_code }}</div>
            <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 6px;">
                📍 {{ badge.venue }} • 🗓️ {{ badge.event_date }}
            </div>
        </div>

        <div class="badge-footer">
            <div style="text-align: left;">
                <div style="font-size: 0.65rem; color: #64748b; text-transform: uppercase;">Ticket Ref:</div>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 800; color: #ffffff;">
                    {{ badge.ticket_number }}
                </div>
            </div>
            <!-- Dynamic QR Code -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data={{ badge.ticket_number }}" 
                 alt="Badge QR" style="width: 44px; height: 44px; border-radius: 6px; background: #fff; padding: 2px;">
        </div>
    </div>

    <div class="no-print">
        <button onclick="window.print()" style="padding: 12px 28px; background: #008be3; color: #fff; border: none; border-radius: 50px; font-weight: 800; font-size: 1rem; cursor: pointer;">
            🖨️ Print Badge Now
        </button>
    </div>

</body>
</html>
