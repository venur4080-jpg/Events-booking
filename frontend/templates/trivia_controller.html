<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Buzzer Controller — {{ event.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <style>
        body {
            background-color: #070709;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        .header-bar {
            padding: 12px 18px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-matrix {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 12px;
            padding: 14px;
        }

        .buzzer-btn {
            border: none;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: transform 0.1s ease, filter 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .buzzer-btn:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }

        .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-blue { background: linear-gradient(135deg, #0284c7, #0284c7); }
        .btn-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar">
        <div>
            <span style="font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; font-weight: 800;">Attendee Buzzer</span>
            <div style="font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 800; color: #fff;">{{ event.title[:24] }}...</div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 0.72rem; color: #94a3b8; font-weight: 700;">Score:</div>
            <strong style="color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 1.15rem;" id="userScore">0 XP</strong>
        </div>
    </div>

    <!-- 4 Colored Shape Buttons -->
    <div class="btn-matrix">
        <button type="button" class="buzzer-btn btn-red" onclick="buzzOption('A')">
            <span>🔺</span>
            <span style="font-size: 0.85rem; font-weight: 900; margin-top: 6px; letter-spacing: 1px;">OPTION A</span>
        </button>

        <button type="button" class="buzzer-btn btn-blue" onclick="buzzOption('B')">
            <span>🔷</span>
            <span style="font-size: 0.85rem; font-weight: 900; margin-top: 6px; letter-spacing: 1px;">OPTION B</span>
        </button>

        <button type="button" class="buzzer-btn btn-yellow" onclick="buzzOption('C')">
            <span>🟡</span>
            <span style="font-size: 0.85rem; font-weight: 900; margin-top: 6px; letter-spacing: 1px;">OPTION C</span>
        </button>

        <button type="button" class="buzzer-btn btn-green" onclick="buzzOption('D')">
            <span>🟩</span>
            <span style="font-size: 0.85rem; font-weight: 900; margin-top: 6px; letter-spacing: 1px;">OPTION D</span>
        </button>
    </div>

    <!-- Status Ticker -->
    <div style="padding: 10px 14px; background: #000; text-align: center; font-size: 0.82rem; color: #94a3b8;" id="statusMsg">
        Tap the matching colored shape shown on the stage screen!
    </div>

    <script>
        let questionStartTime = Date.now();

        async function buzzOption(opt) {
            const timeTaken = Date.now() - questionStartTime;
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }

            document.getElementById('statusMsg').innerHTML = `⚡ Answer <strong style="color:#fff;">${opt}</strong> locked in! Scoring...`;

            try {
                const res = await fetch('/api/event/{{ event.id }}/trivia-submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question_id: 1, option: opt, time_taken_ms: timeTaken })
                });
                const data = await res.json();
                if (data.ok) {
                    document.getElementById('userScore').textContent = `${data.total_score} XP`;
                    document.getElementById('statusMsg').innerHTML = data.message;
                    if (window.showToast) window.showToast(data.message, data.is_correct ? 'success' : 'error', 3000);
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
