<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Events Booking</title>
    <!-- Link to static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5.0">
    <script src="{{ url_for('static', filename='themes.js') }}?v=5.0"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">
    <style>
        .login-card, .login-card * {
            color-scheme: dark !important;
        }
        /* Hide Microsoft Edge native password reveal icon */
        input::-ms-reveal,
        input::-ms-clear,
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        .login-card .input-field,
        .input-field,
        input.input-field,
        input,
        select,
        textarea {
            background-color: rgba(0, 0, 0, 0.3) !important;
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: #ffffff !important;
            color-scheme: dark !important;
        }
        .login-card .input-field:focus,
        .input-field:focus,
        input:focus,
        select:focus,
        textarea:focus {
            background-color: rgba(0, 0, 0, 0.45) !important;
            background: rgba(0, 0, 0, 0.45) !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 12px rgba(0, 139, 227, 0.25) !important;
            color: #ffffff !important;
        }
        /* Chrome / Edge / Safari Autofill Override */
        input:-webkit-autofill,
        textarea:-webkit-autofill,
        select:-webkit-autofill {
            -webkit-box-shadow: 0 0 0px 1000px #101726 inset !important;
            box-shadow: 0 0 0px 1000px #101726 inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff !important;
            color: #ffffff !important;
            background-color: #101726 !important;
            border: 1px solid var(--glass-border) !important;
            transition: background-color 5000000s ease-in-out 0s, color 5000000s ease-in-out 0s !important;
        }
        input:-webkit-autofill:hover,
        textarea:-webkit-autofill:hover,
        select:-webkit-autofill:hover {
            -webkit-box-shadow: 0 0 0px 1000px #101726 inset !important;
            box-shadow: 0 0 0px 1000px #101726 inset !important;
            -webkit-text-fill-color: #ffffff !important;
            color: #ffffff !important;
        }
        input:-webkit-autofill:focus,
        textarea:-webkit-autofill:focus,
        select:-webkit-autofill:focus {
            border-color: var(--primary) !important;
            -webkit-box-shadow: 0 0 0px 1000px #101726 inset, 0 0 12px rgba(0, 139, 227, 0.25) !important;
            box-shadow: 0 0 0px 1000px #101726 inset, 0 0 12px rgba(0, 139, 227, 0.25) !important;
            -webkit-text-fill-color: #ffffff !important;
            color: #ffffff !important;
        }
        /* Standard Autofill */
        input:autofill,
        textarea:autofill,
        select:autofill {
            box-shadow: 0 0 0px 1000px #101726 inset !important;
            -webkit-text-fill-color: #ffffff !important;
            caret-color: #ffffff !important;
            color: #ffffff !important;
            background-color: #101726 !important;
            border: 1px solid var(--glass-border) !important;
            transition: background-color 5000000s ease-in-out 0s, color 5000000s ease-in-out 0s !important;
        }
        input:autofill:focus,
        textarea:autofill:focus,
        select:autofill:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0px 1000px #101726 inset, 0 0 12px rgba(0, 139, 227, 0.25) !important;
            -webkit-text-fill-color: #ffffff !important;
            color: #ffffff !important;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Forgot Password Form -->
        <div class="login-card" id="forgot-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
                <a href="{{ url_for('login') }}" class="back-btn-unified">
                    <span class="arrow">←</span> Back to Login
                </a>
                <div class="logo" style="font-size: 1.2rem;">Events <span>Booking</span></div>
            </div>
            <h2 class="form-title">Reset Password</h2>2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;">
                Please verify your identity using your profile details.
            </p>
            <form method="POST" action="{{ url_for('forgot_password') }}" onsubmit="return validateForgotPasswordForm(this)">

                <div class="input-group">
                    <label for="username">User ID or Email</label>
                    <input type="text" id="username" name="username" class="input-field" required placeholder="Enter your User ID or Email" autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="college_id">Registered College ID</label>
                    <input type="text" id="college_id" name="college_id" class="input-field" required
                        placeholder="Enter your College ID">
                </div>

                <div class="input-group">
                    <label for="phone">Registered Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="input-field" required
                        placeholder="Enter your Phone Number" oninput="handleForgotPhoneInput(this)" maxlength="15" autocomplete="tel">
                    <span id="phone_err" class="otp-status-text" style="display:none; margin-top: 4px;"></span>
                </div>

                <div class="input-group" style="margin-top: 1.5rem;">
                    <label for="new_password">New Password</label>
                    <div class="password-toggle-wrapper">
                        <input type="password" id="new_password" name="new_password" class="input-field" required placeholder="••••••••" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new_password', this)" title="Show password" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" x2="22" y1="2" y2="22"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="password-toggle-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" class="input-field" required placeholder="••••••••" autocomplete="new-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('confirm_password', this)" title="Show password" tabindex="-1" aria-label="Toggle password visibility">
                            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-icon eye-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" x2="22" y1="2" y2="22"/>
                            </svg>
                        </button>
                    </div>
                </div>

                {% if error %}
                <p class="error-msg"
                    style="color: #ff4444; background: rgba(255, 68, 68, 0.1); padding: 10px; border-radius: 5px; text-align: center; margin-bottom: 1rem; border: 1px solid rgba(255, 68, 68, 0.3);">
                    {{ error }}</p>
                {% endif %}

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">RESET PASSWORD</button>

                <div style="text-align: center; margin-top: 1rem;">
                    <a href="{{ url_for('login') }}"
                        style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">Back to Login</a>
                </div>
            </form>
        </div>

    </div>

    <script>
        function handleForgotPhoneInput(input) {
            const errEl = document.getElementById('phone_err');
            if (!errEl) return;
            if (!input.value.trim()) {
                errEl.style.display = 'none';
                return;
            }
            errEl.style.display = 'block';
            const res = validateMobileNumber(input.value);
            if (!res.valid) {
                errEl.className = 'otp-status-text error';
                errEl.textContent = '❌ ' + res.error;
            } else {
                errEl.className = 'otp-status-text success';
                errEl.textContent = '✓ Valid 10-digit mobile number';
            }
        }

        function validateForgotPasswordForm(form) {
            const phoneInput = form.querySelector('#phone');
            if (phoneInput) {
                const check = validateMobileNumber(phoneInput.value);
                if (!check.valid) {
                    alert('⚠️ ' + check.error);
                    phoneInput.focus();
                    return false;
                }
            }
            return true;
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === 'password';
            if (isPassword) {
                input.type = 'text';
                btn.classList.add('is-revealed');
                btn.title = 'Hide password';
                const openIcon = btn.querySelector('.eye-open');
                const closedIcon = btn.querySelector('.eye-closed');
                if (openIcon) openIcon.style.display = 'none';
                if (closedIcon) closedIcon.style.display = 'block';
            } else {
                input.type = 'password';
                btn.classList.remove('is-revealed');
                btn.title = 'Show password';
                const openIcon = btn.querySelector('.eye-open');
                const closedIcon = btn.querySelector('.eye-closed');
                if (openIcon) openIcon.style.display = 'block';
                if (closedIcon) closedIcon.style.display = 'none';
            }
        }
    </script>
    <script src="{{ url_for('static', filename='animations.js') }}"></script>
</body>

</html>
