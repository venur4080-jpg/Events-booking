<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Pass Widget — {{ event.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        .widget-card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 1.4rem;
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .w-btn {
            background: linear-gradient(135deg, #0284c7, #00d2ff);
            color: #0b0f19;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: block;
            text-decoration: none;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
            transition: transform 0.2s;
        }

        .w-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.72rem; color: #38bdf8; font-weight: 800; text-transform: uppercase;">Verified Pass</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; color: #34d399;">{{ event.price }}</span>
        </div>
        <h3 style="font-family: 'Outfit', sans-serif; font-size: 1.25rem; margin: 0 0 6px; line-height: 1.3;">{{ event.title }}</h3>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px;">
            📅 {{ event.date }} • 📍 {{ event.venue }}
        </div>
        <a href="{{ url_for('event_detail', event_id=event.id) }}" target="_blank" rel="noopener noreferrer" class="w-btn">
            Book Passes Now ➔
        </a>
        <div style="text-align: center; font-size: 0.68rem; color: #64748b; margin-top: 8px;">
            Powered by Events Booking Ecosystem
        </div>
    </div>

</body>
</html>
